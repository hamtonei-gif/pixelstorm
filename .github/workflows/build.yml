name: Build PixelStorm Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install opencv-python
          pip install mediapipe==0.10.9

      - name: Build game EXE (_game.exe)
        run: |
          pyinstaller --onefile --noconsole --name _game `
            --add-data "puzzle.jpg;." `
            --hidden-import mediapipe `
            --hidden-import mediapipe.python `
            --hidden-import mediapipe.python.solutions `
            --hidden-import mediapipe.python.solutions.hands `
            --hidden-import mediapipe.python.solutions.drawing_utils `
            --collect-all mediapipe `
            --collect-all cv2 `
            _game.py

      - name: Build launcher EXE (PixelStorm.exe)
        run: |
          pyinstaller --onefile --noconsole --name PixelStorm `
            main.py

      - name: Collect both EXEs
        run: |
          mkdir output
          copy dist\PixelStorm.exe output\
          copy dist\_game.exe output\

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelStorm-Windows
          path: output\

name: Build PixelStorm Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install opencv-python
          pip install mediapipe

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name PixelStorm --add-data "puzzle.jpg;." --hidden-import mediapipe --hidden-import cv2 --collect-all mediapipe main.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelStorm-Windows
          path: dist/PixelStorm.exe
